# Hard 15-minute IP ban after repeated failed / rate-limited Medica logins.
# Deploy on the nginx host:
#   sudo cp nginx/fail2ban/filter.d/medica-auth-login.conf /etc/fail2ban/filter.d/
#   sudo cp nginx/fail2ban/jail.d/medica-auth.conf /etc/fail2ban/jail.d/
#   sudo fail2ban-client reload
#
# Requires: medica-auth-login.access.log (see snippets/medica-auth-rate-limit.conf)

[medica-auth-login]
enabled  = true
port     = http,https
filter   = medica-auth-login
logpath  = /var/log/nginx/medica-auth-login.access.log
backend  = auto
maxretry = 20
findtime = 15m
bantime  = 15m
action   = %(banaction)s[name=%(__name__)s-tcp, port="%(port)s", protocol="tcp", chain="%(chain)s"]
