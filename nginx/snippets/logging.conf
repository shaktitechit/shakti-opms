# Shared access log format for OPMS edge (brute-force / scrape review).
# Include from http{} context, e.g.:
#   include /etc/nginx/snippets/logging.conf;
#
# On the host after deploy:
#   tail -F /var/log/nginx/auth-login.access.log

log_format opms_main '$remote_addr $host $request_method $uri $status '
                     '$body_bytes_sent $request_time '
                     '"$http_referer" "$http_user_agent"';

# Auth edge rate zones (per client IP).
# ~20 login / 15 min ≈ 1.3 r/m → rate=2r/m + burst; excess get 429 until tokens refill
# (~10–15 min dry-out). App-layer also blocks IP for a full 15-minute window.
# Requires: limit_req_zone in http{} (this file) + limit_req in location
# (auth-rate-limit.conf) + optional fail2ban jail for hard 15-min bans.
limit_req_zone $binary_remote_addr zone=auth_login:10m rate=2r/m;
limit_req_zone $binary_remote_addr zone=auth_handoff:10m rate=5r/m;
