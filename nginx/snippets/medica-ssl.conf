# Shared TLS material for all Medica hostnames (one multi-SAN cert or wildcard).
# Issued by:
#   sudo certbot certonly --webroot -w /var/www/html \
#     -d opms.medicaent.in -d app.medicaent.in -d users.medicaent.in -d plans.medicaent.in \
#     -d leads.medicaent.in -d api.medicaent.in -d auth.medicaent.in \
#     -d api-products.medicaent.in -d api-parties.medicaent.in -d api-plans.medicaent.in \
#     -d api-leads.medicaent.in -d api-message.medicaent.in \
#     --cert-name opms.medicaent.in
#
# If you already have a wildcard cert (*.medicaent.in), point these two lines at that path instead.

ssl_certificate     /etc/letsencrypt/live/opms.medicaent.in/fullchain.pem;
ssl_certificate_key /etc/letsencrypt/live/opms.medicaent.in/privkey.pem;
include /etc/nginx/snippets/ssl-params.conf;
