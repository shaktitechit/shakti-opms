# Location-level auth rate limits for Medica (requires logging.conf zones in http{}).
# Include inside the auth.medicaent.in server block only.
#
# Shares auth_login / auth_handoff zones with OPMS (same nginx host).
# After burst is exhausted, nginx returns 429 until the leaky bucket refills
# (≈10–15 min at rate=2r/m). Pair with fail2ban for a hard 15-minute IP ban.

location = /api/auth/login {
    limit_req zone=auth_login burst=20 nodelay;
    limit_req_status 429;
    access_log /var/log/nginx/medica-auth-login.access.log opms_main;
    include /etc/nginx/snippets/proxy-params.conf;
    proxy_pass http://medica_auth_service;
    proxy_read_timeout 120s;
}

location = /api/auth/handoff/exchange {
    limit_req zone=auth_handoff burst=40 nodelay;
    limit_req_status 429;
    access_log /var/log/nginx/medica-auth-handoff.access.log opms_main;
    include /etc/nginx/snippets/proxy-params.conf;
    proxy_pass http://medica_auth_service;
    proxy_read_timeout 60s;
}
