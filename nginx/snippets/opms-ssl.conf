# Shared TLS material for all OPMS hostnames (one multi-SAN cert).
# Issued by:
#   sudo certbot certonly --webroot -w /var/www/html \
#     -d opms.spspl.com -d app.spspl.com -d users.spspl.com -d plans.spspl.com \
#     -d leads.spspl.com -d api-opms.spspl.com -d auth.spspl.com \
#     -d api-products.spspl.com -d api-parties.spspl.com -d api-plans.spspl.com \
#     -d api-leads.spspl.com -d api-message.spspl.com -d api-notification.spspl.com \
#     --cert-name opms.spspl.com
#
# If you already have a wildcard cert, point these two lines at that path instead.

ssl_certificate     /etc/letsencrypt/live/opms.spspl.com/fullchain.pem;
ssl_certificate_key /etc/letsencrypt/live/opms.spspl.com/privkey.pem;
include /etc/nginx/snippets/ssl-params.conf;
